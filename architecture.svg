<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#64d7ff"/>
      <stop offset="1" stop-color="#9e8cff"/>
    </linearGradient>
    <style>
      .bg{fill:#07111f}.box{fill:#102139;stroke:#29415d;stroke-width:2}
