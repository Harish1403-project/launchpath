  </defs>
  <rect class="bg" width="1400" height="360" rx="28"/>
  <text x="70" y="64" class="cap">LaunchPath production concept</text>

  <rect class="box" x="60" y="105" rx="18" width="230" height="160"/>
  <text x="85" y="150" class="title">Product Events</text>
  <text x="85" y="184" class="sub">Profile completion</text>
  <text x="85" y="209" class="sub">Uploads & inactivity</text>
