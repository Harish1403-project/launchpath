      .arrow{stroke:url(#g);stroke-width:5;fill:none;marker-end:url(#arrow)}
      .cap{font:700 17px Inter,Arial,sans-serif;fill:#cbeeff}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8ca6ff"/>
