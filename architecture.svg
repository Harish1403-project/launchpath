  <path class="arrow" d="M 290 185 L 327 185"/>
  <path class="arrow" d="M 565 185 L 602 185"/>
  <path class="arrow" d="M 840 185 L 877 185"/>
  <path class="arrow" d="M 1115 185 L 1152 185"/>
